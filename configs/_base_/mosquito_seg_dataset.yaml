dataloader:
  batch_size: 16
  num_workers: 4
  shuffle_train: True

dataset:
  type: "MosquitoSegDataset"
  # Trỏ tới thư mục chứa dữ liệu Segmentation (COCO Polygon format hoặc YOLO-Seg format)
  train_path: "data/mosquito_seg_polygon/train/images"
  train_ann: "data/mosquito_seg_polygon/train/annotations.json"
  val_path: "data/mosquito_seg_polygon/val/images"
  val_ann: "data/mosquito_seg_polygon/val/annotations.json"
  num_classes: 3
  class_names: ['aedes', 'culex', 'anopheles']

pipeline:
  input_size: [640, 640]
  transforms:
    - type: "Resize"          # Hàm Resize sẽ tự động ép tọa độ ảnh, mask và box về tỷ lệ đúng
    - type: "RandomHorizontalFlip"
      prob: 0.5
    - type: "ColorJitter"
      brightness: 0.2
      contrast: 0.2
    - type: "Normalize"       # Bạn cần truyền mean/std vào để quá trình hội tụ không bị hỏng ngầm
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
    - type: "FormatSample"    # Phải có format cuối cùng này để biến list tọa độ thành Tensor hợp lệ